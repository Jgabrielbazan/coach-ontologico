<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14121f" />
    <meta name="description" content="Coach ontológico por voz en tiempo real." />
    <title>Coach Ontológico</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icono.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app entrar" id="pantalla-entrar">
      <div class="marca">
        <img src="/icono.svg" alt="" width="96" height="96" />
        <h1>Coach Ontológico</h1>
        <p>Tu coach por voz. Entra con tu cuenta de Google y sigue donde lo dejaste, en la PC o en el móvil.</p>
      </div>
      <button type="button" class="boton-google" id="boton-entrar">Entrar con Google</button>
      <p class="error" id="error-entrar" role="alert" hidden></p>
    </main>

    <main class="app" id="pantalla-coach" hidden>
      <header class="cabecera">
        <div>
          <p class="etiqueta" id="etiqueta-nivel">Nivel 1 de 3</p>
          <h1 id="nombre-nivel">El Observador Inicial</h1>
        </div>
        <ol class="progreso" id="progreso" aria-label="Progreso del programa">
          <li data-nivel="1"></li>
          <li data-nivel="2"></li>
          <li data-nivel="3"></li>
        </ol>
      </header>

      <section class="centro">
        <button class="orbe" id="boton-principal" type="button" aria-live="polite">
          <span class="orbe-texto" id="texto-boton">Empezar sesión</span>
        </button>
        <p class="estado" id="estado" role="status">Toca para hablar con tu coach</p>
        <video id="vista-camara" class="vista-camara" playsinline muted hidden></video>
      </section>

      <section class="subtitulos" id="subtitulos" aria-label="Transcripción" aria-live="polite" hidden></section>

      <nav class="controles" id="controles" hidden>
        <button type="button" id="boton-silencio" class="control" aria-pressed="false">Silenciar micrófono</button>
        <button type="button" id="boton-camara" class="control" aria-pressed="false">Activar cámara</button>
        <button type="button" id="boton-subtitulos" class="control" aria-pressed="false">Ver texto</button>
      </nav>

      <footer class="pie">
        <p id="ultimo-feedback" class="feedback" hidden></p>
        <p class="cuenta">
          <span id="cuenta"></span> ·
          <button type="button" id="boton-salir" class="enlace">Cerrar sesión</button> ·
          <button type="button" id="boton-reiniciar" class="enlace">Reiniciar programa</button>
        </p>
      </footer>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
