name: Enviar recordatorios

# Cada hora revisa a quién le toca su recordatorio diario y le manda la
# notificación. Usa la misma cuenta de publicación (FIREBASE_SERVICE_ACCOUNT).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: recordatorios
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Comprobar que la llave esté configurada
        env:
          LLAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$LLAVE" ]; then
            echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT."
            echo "SIN_LLAVE=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SIN_LLAVE != '1'

      - uses: actions/setup-node@v4
        if: env.SIN_LLAVE != '1'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar dependencias
        if: env.SIN_LLAVE != '1'
        run: npm --prefix functions ci

      - uses: google-github-actions/auth@v2
        if: env.SIN_LLAVE != '1'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Enviar
        if: env.SIN_LLAVE != '1'
        run: node functions/enviar-recordatorios.js
